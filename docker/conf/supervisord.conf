[supervisord]
nodaemon=true
user=root

[program:castellan]
command=/bin/bash /app/castellan/docker/scripts/castellan.sh
directory=/app/castellan
autostart=true
autorestart=true
stopsignal=INT
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/1
stderr_logfile_maxbytes=0
stopasgroup=true

[program:castellan-rack]
command=/bin/bash /app/castellan/docker/scripts/castellan-rack.sh
directory=/app/castellan
autostart=true
autorestart=true
stopsignal=INT
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/1
stderr_logfile_maxbytes=0
stopasgroup=true
