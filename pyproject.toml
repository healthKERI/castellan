[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weirwood"
version = "0.1.0"
description = "Standalone enterprise credential management server for use with the Whisper plugin."
requires-python = ">=3.12.6"
dependencies = [
    "hio==0.6.19",
    "keri==1.3.4",
    "falcon>=3.1.0",
    "http_sfv>=0.9.8",
    "mongoengine>=0.29.1",
    "pymongo>=4.11.2",
    "multicommand>=1.0.0",
]

[project.scripts]
weirwood = "weirwood.app.cli.weirwood:main"

[tool.setuptools.packages.find]
where = ["src"]
