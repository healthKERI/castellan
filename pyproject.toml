[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "castellan"
version = "0.1.0"
description = "Standalone enterprise credential management server for use with the Castellan plugin."
requires-python = ">=3.12.6"
dependencies = [
    "hio==0.6.19",
    "keri~=1.3.5",
    "falcon>=3.1.0",
    "http_sfv>=0.9.8",
    "mongoengine>=0.29.1",
    "pymongo>=4.11.2",
    "multicommand>=1.0.0",
    "requests>=2.34.2"
]

[project.scripts]
castellan = "castellan.app.cli.castellan:main"

[tool.setuptools.packages.find]
where = ["src"]
