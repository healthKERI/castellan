apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "castellan.fullname" . }}-init
  labels:
    {{- include "castellan.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.castellanInit.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.castellanInit.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "castellan.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: castellan-init
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "castellan.serviceAccountName" . }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: castellan-init
          image: "{{ .Values.image.castellan.repository }}:{{ .Values.image.castellan.tag }}"
          imagePullPolicy: {{ .Values.image.castellan.pullPolicy }}
          command: ["docker/scripts/castellan-init.sh"]
          envFrom:
            - configMapRef:
                name: {{ include "castellan.fullname" . }}-env
          env:
            {{- include "castellan.mongoEnv" . | nindent 12 }}
            - name: CASTELLAN_RACK_LOCATION_HOST
              value: {{ required "rack.externalLocation.host is required" .Values.rack.externalLocation.host | quote }}
          volumeMounts:
            - name: keri-data
              mountPath: /usr/local/var/keri
      volumes:
        - name: keri-data
          persistentVolumeClaim:
            claimName: {{ include "castellan.fullname" . }}-keri-data