apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "castellan.fullname" . }}-keri-data
  labels:
    {{- include "castellan.labels" . | nindent 4 }}
  annotations:
    # Created once via a pre-install hook (ahead of the castellan-init Job,
    # which mounts it) and never re-created on upgrade -- it holds the
    # shared castellan/rack LMDB keystore, so it must not be deleted and
    # recreated the way a hook-delete-policy would require.
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-5"
    {{- if .Values.persistence.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}