# Standalone Service that provisions a real AWS NLB routed to castellan-rack's
# pods, deliberately OUTSIDE the Helm release -- see chart-deployment-testing/README.md's
# "Reachability test" section for why. `helm uninstall`/`helm install` cycles
# of the `castellan` release never touch this, so its NLB (and hostname)
# survive any number of app reinstalls, mirroring how a real deployer's
# ingress is infrastructure they own separately from this chart.
#
# Apply once: kubectl apply -f chart-deployment-testing/nlb-service.yaml
# Tear down independently of the app: kubectl delete -f chart-deployment-testing/nlb-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: castellan-rack-nlb
  namespace: castellan-test
  annotations:
    # In-tree AWS cloud provider annotation -- provisions a classic NLB
    # without needing the separate AWS Load Balancer Controller add-on
    # (not installed by testing/cluster.yaml).
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    # cluster.yaml's single node lands in only one of the NLB's AZs, and
    # NLBs default to cross-zone load balancing disabled -- without this,
    # DNS round-robins clients across AZs and roughly half of connections
    # hang/timeout hitting an AZ with no registered target.
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  # Matches the castellan chart's pod labels (see _helpers.tpl's
  # castellan.selectorLabels + the castellan-init/deployment-castellan.yaml
  # component label) for release name "castellan" -- intentionally hardcoded
  # rather than templated, since this manifest is applied directly via
  # kubectl, not through Helm.
  selector:
    app.kubernetes.io/name: castellan
    app.kubernetes.io/instance: castellan
    app.kubernetes.io/component: castellan
  ports:
    - name: tcp
      port: 5923
      targetPort: 5923
